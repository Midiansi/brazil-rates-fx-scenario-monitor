name: Keep Repository Active

on:
  schedule:
    # Monthly (at most 31 days apart), well before the 60-day inactivity limit.
    - cron: '41 3 1 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/keep-repository-active.yml']

permissions:
  contents: write

concurrency:
  group: keep-repository-active
  cancel-in-progress: false

jobs:
  empty-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - name: Push an empty activity commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m 'chore: keep scheduled workflows active'

          # Preserve the empty commit if the market-data updater pushes first.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase --keep-empty origin/main
          done
          echo 'Could not push the empty activity commit after three attempts.' >&2
          exit 1
