[client]
showErrorDetails = "none"
toolbarMode = "minimal"

[server]
headless = true
enableStaticServing = true

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#E8981F"
backgroundColor = "#0D0F12"
secondaryBackgroundColor = "#1B1F26"
textColor = "#EEF0F3"
borderColor = "#2C323B"
baseRadius = "8px"
font = "Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
codeFont = "'Geist Mono', ui-monospace, monospace"

[[theme.fontFaces]]
family = "Geist"
url = "app/static/fonts/Geist-Variable.woff2"
weight = "100 900"

[[theme.fontFaces]]
family = "Geist Mono"
url = "app/static/fonts/GeistMono-Variable.woff2"
weight = "100 900"
